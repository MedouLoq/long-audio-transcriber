# HTTPS reverse proxy in front of the app (bind the app to 127.0.0.1).
server {
    listen 443 ssl;
    server_name transcriber.example.com;
    # ssl_certificate / ssl_certificate_key: e.g. from certbot

    client_max_body_size 2048m;          # match MAX_UPLOAD_MB
    proxy_request_buffering off;         # stream big uploads to the app
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
